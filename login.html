</style></head><body><main class="card"><div class="logo" aria-hidden="true">✈</div><h1>Viaggi Mensili</h1><p class="muted">Accedi per registrare le notti, calcolare gli importi settimanali e controllare il totale mensile.</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://rqqqmekwcpuhfzapeybq.supabase.co",SUPABASE_KEY="sb_publishable_PN9pvW-gjwFz1l_1Ouie8A_yZjWrPYD",client=window.supabase?.createClient?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null,$=id=>document.getElementById(id);let mode='signin';
function show(t){$('message').textContent=t}function setMode(m){mode=m;const up=m==='signup';$('tabIn').classList.toggle('active',!up);$('tabUp').classList.toggle('active',up);$('submit').textContent=up?'Crea account':'Accedi';$('password').autocomplete=up?'new-password':'current-password';$('forgot').hidden=up;show('')}

$('forgot').onclick=async()=>{if(!client){show('Servizio di accesso non disponibile.');return}const email=$('email').value.trim();if(!email){show('Inserisci prima la tua email.');$('email').focus();return}show('Invio richiesta…');try{const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/login.html'});show(error?'Errore: '+error.message:'Se l’indirizzo è registrato, riceverai le istruzioni per reimpostare la password.')}catch(err){show('Errore di connessione: '+(err?.message||'riprova tra poco.'))}};
if(!client)show('Impossibile caricare il servizio di accesso. Controlla la connessione e ricarica.');else client.auth.getSession().then(({data})=>{if(data.session)location.replace('index.html')}).catch(()=>{});const params=new URLSearchParams(location.search);if(params.get('error')==='library')show('La libreria di accesso non è stata caricata. Aggiorna la pagina e riprova.');
</script></body></html>
